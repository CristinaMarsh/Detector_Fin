headline: 貴州茅台：板塊資金流出，六十日回撤接近預警區間
dek: 輿情面相對平靜，回撤主要來自板塊性的資金流出。
body_paragraphs:
  - 該股六十日回撤已接近本站的預警閾值，屬於風險標籤中的回撤成分。從公開討論看，輿情面相對平靜，回撤更像是板塊性資金流出的結果，而非個股層面的負面事件驅動。
  - 對照之下，情緒訊號並未出現同步惡化，這種價格與輿情的背離，正是需要人工覆核的情境：風險分數上升的同時，證據面未必支持一個明確的負面敘事。
  - 本文為研究用途的風險整理，不構成任何投資建議或買賣要約。
