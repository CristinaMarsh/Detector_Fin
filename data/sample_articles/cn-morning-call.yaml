headline: A股開盤前風險快評：兩市成交回落，題材輪動下的個股尾部風險升溫
dek: 情緒指標偏弱，部分權值股距跌停帶的距離收窄。
body_paragraphs:
  - 開盤前彙整顯示，兩市成交較前一交易日回落，題材輪動加快。在此背景下，個別權值股的距漲跌停帶距離收窄，屬於本站風險標籤中需明確記錄的一項成分。
  - 股吧與雪球等公開討論的發帖強度出現局部躍升，情緒 Z 值轉為偏負，但集中於少數可信度較低的來源，尚需以價格與成交的實際變化佐證，避免將單一來源的噪音誤判為系統性訊號。
  - 交易暫停與停牌在本市場較為常見，會以明確的缺口記錄呈現，而非以前值填補。以上為風險狀態的整理，不涉及任何買賣建議。
