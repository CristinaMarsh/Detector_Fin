headline: 輝達（NVIDIA）：新聞熱度攀升，隱含波動處於近期高位
dek: 事件強度放大主要來自產品與行業報導，負面占比不高。
body_paragraphs:
  - 近期新聞事件強度達六十日均值的數倍，隱含波動百分位升至高位。從結構看，熱度上升多與產品發表與供應鏈報導相關，情緒面雖偏活躍，但明確的負面事件占比有限。
  - 對研究而言，值得記錄的是熱度與尾部風險之間的落差：高新聞流量會推升本站的風險分數，卻不必然對應更高的下行風險，須與價格與波動的實際走勢交叉驗證。
  - 本文僅整理公開資料所呈現的風險輪廓，不對該股作出任何買賣判斷。
