[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detector_fin"
version = "0.2.2"
description = "Daily equity risk assessment across multiple markets (US, CN, KR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "exchange_calendars>=4.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Third-party market-data clients. Optional: the core install and all tests
# (which use recorded fixtures) run without these.
fetch = [
    "yfinance>=0.2.40",
    "akshare>=1.13",
    "pykrx>=1.0.45",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detector_fin = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
