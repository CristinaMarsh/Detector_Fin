[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "detector_fin"
version = "0.2.2"
description = "Daily equity risk assessment across multiple markets (US, CN, KR)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "exchange_calendars>=4.5",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
]
# Third-party market-data clients. Optional: the core install and all tests
# (which use recorded fixtures) run without these.
fetch = [
    "yfinance>=0.2.40",
    "akshare>=1.13",
    "pykrx>=1.0.45",
]
# FinBERT-family sentiment scorers (TransformersScorer). Optional: the core
# install and all tests run with the deterministic lexicon baseline.
sentiment = [
    "transformers>=4.40",
    "torch>=2.2",
]
# Simplified -> Traditional conversion for the publication build. Optional: the
# generator degrades to identity (fixtures are authored in Traditional) without it.
publish = [
    "opencc-python-reimplemented>=0.1.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
detector_fin = ["py.typed", "publish/templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
]
