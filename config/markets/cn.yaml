# China A-shares. Price limits vary by board; suspensions are frequent and are
# recorded as explicit events (labels 4d, 4e). Return-jump label (4c) is
# censored under limits and disabled.
market_id: CN
timezone: Asia/Shanghai
trading_calendar: XSHG
decision_time_local: "08:30"   # pre-open, local tz
currency: CNY
price_limit:                   # fractional daily band by board
  main: 0.10                   # main board
  star_chinext: 0.20           # STAR (688xxx) and ChiNext (300xxx)
  st: 0.05                     # ST / *ST names
ticker_suffixes:
  - ".SS"                      # Shanghai
  - ".SZ"                      # Shenzhen
sentiment_sources:             # ordered by priority (section 1.1)
  - market_data                # AkShare primary, yfinance .SS/.SZ fallback
  - eastmoney_guba             # stock forum posts
  - xueqiu
  - rss_news_cn
  - x_twitter                  # optional, globally followed names only
label_params:
  k: 5
  d: 0.10
  rv_percentile: 0.95
  limit_hit_is_event: true     # label 4d
  suspension_is_event: true    # label 4e
  # j intentionally left at default but return-jump label is censored under
  # limits at evaluation time; see section 4(c).
