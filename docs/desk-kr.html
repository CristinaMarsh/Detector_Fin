<style>
:root {
  --paper: #fbfaf7; --ink: #1a1a1a; --ink-2: #4a4a4a; --ink-3: #7a7a72;
  --line: #e4e2da; --line-2: #d0cdc2; --accent: #8a1c1c; --link: #7a1414;
  --card: #ffffff; --band: #f3f1ea;
  --us: #2a6fb0; --cn: #c23a2f; --kr: #1d8a6b;
  --serif: "Songti TC", "Noto Serif CJK TC", Georgia, "Times New Roman", serif;
  --sans: -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei",
    "Noto Sans CJK TC", "Heiti TC", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #16161a; --ink: #ececea; --ink-2: #b6b6b0; --ink-3: #85857c;
    --line: #2b2b30; --line-2: #3a3a40; --accent: #e0736a; --link: #e88b82;
    --card: #1e1e22; --band: #202024;
    --us: #5a9bd8; --cn: #e0736a; --kr: #47b892;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--sans); font-size: 16px; line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--link); }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 18px; }

/* masthead */
.masthead { border-bottom: 3px double var(--line-2); padding: 20px 0 10px; }
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand a.title { color: var(--ink); text-decoration: none; font-family: var(--serif);
  font-size: 30px; font-weight: 700; letter-spacing: .02em; }
.tagline { color: var(--ink-3); font-size: 13px; }
.desknav { display: flex; gap: 4px 18px; flex-wrap: wrap; padding: 10px 0 2px;
  border-top: 1px solid var(--line); margin-top: 12px; font-size: 14px; }
.desknav a { color: var(--ink-2); text-decoration: none; padding: 4px 0; }
.desknav a:hover { color: var(--accent); }
.desknav a.dot::before { content: "•"; color: var(--line-2); margin-right: 18px; }

/* generic */
main { padding: 26px 0 40px; }
.kicker { font-size: 12px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--accent); font-weight: 600; }
.sec-head { font-family: var(--serif); font-size: 20px; margin: 26px 0 12px;
  padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.badge { display: inline-block; font-size: 11px; padding: 2px 8px; border-radius: 3px;
  color: #fff; vertical-align: middle; }
.badge.us { background: var(--us); } .badge.cn { background: var(--cn); } .badge.kr { background: var(--kr); }
.muted { color: var(--ink-3); font-size: 13px; }

/* front page cards */
.cards { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 720px) { .cards { grid-template-columns: 1fr 1fr 1fr; } }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 8px;
  padding: 16px 16px 14px; display: flex; flex-direction: column; }
.card .headline { font-family: var(--serif); font-size: 19px; line-height: 1.35; margin: 8px 0; }
.card .headline a { color: var(--ink); text-decoration: none; }
.card .headline a:hover { color: var(--accent); }
.card .dek { color: var(--ink-2); font-size: 14px; }
.card .more { margin-top: auto; padding-top: 10px; font-size: 13px; }

.deskcols { display: grid; grid-template-columns: 1fr; gap: 22px; }
@media (min-width: 720px) { .deskcols { grid-template-columns: 1fr 1fr 1fr; } }
.brieflist { list-style: none; padding: 0; }
.brieflist li { padding: 10px 0; border-bottom: 1px solid var(--line); }
.brieflist a { color: var(--ink); text-decoration: none; font-weight: 600; }
.brieflist a:hover { color: var(--accent); }
.brieflist .dek { color: var(--ink-3); font-size: 13px; font-weight: 400; }

.trending { background: var(--band); border: 1px solid var(--line); border-radius: 8px;
  padding: 14px 16px; margin-top: 26px; }
.trending ol { margin: 8px 0 0; padding-left: 1.3em; }
.trending li { margin: 4px 0; }
.trending a { color: var(--ink); text-decoration: none; }
.trending a:hover { color: var(--accent); }

/* article */
.article { max-width: 680px; margin: 0 auto; }
.article .headline { font-family: var(--serif); font-size: 30px; line-height: 1.25; margin: 10px 0; }
.article .dek { font-size: 18px; color: var(--ink-2); margin-bottom: 14px; }
.article .byline { color: var(--ink-3); font-size: 13px; border-bottom: 1px solid var(--line);
  padding-bottom: 14px; margin-bottom: 18px; }
.article p.body { margin: 0 0 16px; }
.sources { margin-top: 26px; padding-top: 14px; border-top: 1px solid var(--line); }
.sources h2 { font-size: 14px; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 8px; }
.sources ul { list-style: none; padding: 0; }
.sources li { margin: 6px 0; }
.sources a { color: var(--link); }
.backlink { display: inline-block; margin-top: 24px; font-size: 13px; }

/* about */
.prose { max-width: 680px; margin: 0 auto; }
.prose p { margin: 0 0 16px; }

/* footer */
footer { border-top: 3px double var(--line-2); padding: 20px 0 40px; margin-top: 20px; }
.disclaimer { color: var(--ink-3); font-size: 12.5px; line-height: 1.6; }
.footlinks { margin-top: 10px; font-size: 13px; display: flex; gap: 16px; flex-wrap: wrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
