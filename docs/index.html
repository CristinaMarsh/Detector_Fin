<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Detector Fin</title>
<style>
:root {
  --paper: #fafaf8; --card: #ffffff; --ink: #1c2733; --ink-2: #5a6672;
  --ink-3: #8b95a0; --line: #e6e6e1; --line-2: #d5d5cf;
  --risk-low: #9aa3ac; --risk-mid: #c8860a; --risk-high: #c23a2f;
  --tint-high: #faeeec; --tint-mid: #faf3e2; --ok: #1d7a55; --tint-ok: #e7f3ed;
  --mkt-us: #2a6fb0; --mkt-cn: #c23a2f; --mkt-kr: #1d8a6b;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --paper: #15181c; --card: #1d2127; --ink: #e8eaec; --ink-2: #a8b0b8;
    --ink-3: #737c85; --line: #2b3037; --line-2: #3a404a;
    --risk-low: #7d868f; --risk-mid: #d9a133; --risk-high: #e05a4e;
    --tint-high: #3a2523; --tint-mid: #35301f; --ok: #3fae7f; --tint-ok: #1e2f27;
  }
}
* { box-sizing: border-box; margin: 0; }
body {
  background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  font-size: 15px; line-height: 1.65;
  -webkit-font-smoothing: antialiased;
}
.wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }
.num { font-variant-numeric: tabular-nums; }

header .row1 { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
h1 { font-size: 21px; font-weight: 600; letter-spacing: 0.01em; }
.status { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--tint-ok); color: var(--ok); white-space: nowrap; }
.status.bad { background: var(--tint-high); color: var(--risk-high); }
.meta { font-size: 13px; color: var(--ink-3); margin-top: 4px; }
.disclaim { font-size: 12px; color: var(--ink-3); border-left: 2px solid var(--line-2); padding-left: 8px; margin-top: 10px; }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 22px 0; }
@media (max-width: 560px) { .kpis { grid-template-columns: repeat(2, 1fr); } }
.kpi { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.kpi .k { font-size: 12px; color: var(--ink-3); }
.kpi .v { font-size: 24px; font-weight: 600; margin-top: 2px; }
.kpi .v.warn { color: var(--risk-high); }

.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
.chip {
  font: inherit; font-size: 13px; color: var(--ink-2); background: var(--card);
  border: 1px solid var(--line-2); border-radius: 999px; padding: 5px 14px; cursor: pointer;
}
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:focus-visible { outline: 2px solid var(--mkt-us); outline-offset: 2px; }

.card {
  position: relative; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; margin-bottom: 12px; padding: 14px 16px 14px 22px; overflow: hidden;
}
.spine { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--line); }
.spine i { position: absolute; left: 0; right: 0; bottom: 0; display: block; }

.card .head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.nm { font-size: 16px; font-weight: 600; }
.tk { font-family: var(--mono); font-size: 12px; color: var(--ink-3); }
.mkt { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--ink-2); }
.mkt .sq { width: 8px; height: 8px; border-radius: 2px; }
.score { margin-left: auto; text-align: right; }
.score .n { font-size: 22px; font-weight: 600; line-height: 1.1; }
.score .l { font-size: 11px; color: var(--ink-3); }
.facts { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; color: var(--ink-2); }
.flag { color: var(--risk-mid); }
.flag.hot { color: var(--risk-high); }

details { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 8px; }
summary { cursor: pointer; font-size: 13px; color: var(--ink-2); list-style: none; display: flex; align-items: center; gap: 6px; }
summary::before { content: ""; width: 7px; height: 7px; border-right: 1.5px solid var(--ink-3); border-bottom: 1.5px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; }
details[open] summary::before { transform: rotate(45deg); }
summary:focus-visible { outline: 2px solid var(--mkt-us); outline-offset: 2px; }
.ev { margin: 10px 0 4px; }
.ev h4 { font-size: 12px; font-weight: 600; color: var(--ink-3); letter-spacing: .06em; margin-bottom: 6px; }
.ev ul { padding-left: 1.2em; font-size: 14px; }
.ev li { margin-bottom: 3px; }
.srcs { display: flex; flex-direction: column; gap: 6px; }
.src {
  display: flex; align-items: baseline; gap: 8px; font-size: 13.5px;
  text-decoration: none; color: var(--ink); padding: 7px 10px;
  border: 1px solid var(--line); border-radius: 8px; background: var(--paper);
}
.src:hover { border-color: var(--line-2); }
.src .t { flex: 1; min-width: 0; }
.src .d { font-size: 11px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; }
.src .arrow { color: var(--ink-3); font-size: 12px; }
.contra { font-size: 13px; color: var(--ink-2); background: var(--paper); border-left: 3px solid var(--line-2); padding: 8px 10px; margin-top: 10px; }
.issue { font-size: 12.5px; margin-top: 8px; display: inline-block; color: var(--mkt-us); text-decoration: none; }
.issue:hover { text-decoration: underline; }

footer { margin-top: 34px; font-size: 12px; color: var(--ink-3); border-top: 1px solid var(--line); padding-top: 14px; }
footer a { color: var(--ink-2); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="row1"><h1 id="t-title"></h1><span class="status" id="pill"></span></div>
    <div class="meta"><span id="t-updated"></span> <span class="num" id="gen-at"></span> · <span id="t-cutoff"></span></div>
    <p class="disclaim" id="t-disclaimer"></p>
  </header>

  <section class="kpis" id="kpis" aria-label="summary"></section>

  <nav class="chips" id="chips" aria-label="market filter"></nav>

  <main id="list"></main>

  <footer>
    <span id="t-method"></span>
    <a id="repo-link" href="https://github.com/CristinaMarsh/Detector_Fin" rel="noopener">GitHub</a>
  </footer>
</div>

<script>
const MARKET_COLORS = { US: "var(--mkt-us)", CN: "var(--mkt-cn)", KR: "var(--mkt-kr)" };
const state = { market: "ALL", data: null, L: null };

function riskColor(s) { return s >= 0.6 ? "var(--risk-high)" : (s >= 0.4 ? "var(--risk-mid)" : "var(--risk-low)"); }
function esc(x) { const d = document.createElement("div"); d.textContent = x == null ? "" : String(x); return d.innerHTML; }
function fmtDate(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function domainOf(url) { try { return new URL(url).hostname.replace(/^www\./, ""); } catch { return ""; } }

async function loadJson(url, fallbackId) {
  try {
    const r = await fetch(url, { cache: "no-store" });
    if (!r.ok) throw new Error(String(r.status));
    return await r.json();
  } catch {
    return JSON.parse(document.getElementById(fallbackId).textContent);
  }
}

function renderHeader() {
  const { L, data } = state;
  document.title = L.title;
  document.getElementById("t-title").textContent = L.title;
  document.getElementById("t-updated").textContent = L.updated;
  document.getElementById("gen-at").textContent = fmtDate(data.generated_at);
  document.getElementById("t-cutoff").textContent = L.cutoff;
  document.getElementById("t-disclaimer").textContent = L.disclaimer;
  document.getElementById("t-method").textContent = L.method;
  const pill = document.getElementById("pill");
  const ok = data.pipeline_status === "ok";
  pill.textContent = ok ? L.status_ok : L.status_bad;
  pill.className = "status" + (ok ? "" : " bad");
}

function renderKpis() {
  const { L, data } = state;
  const k = data.kpi || {};
  const items = [
    [L.kpi_monitored, k.monitored, ""],
    [L.kpi_flagged, k.flagged, k.flagged > 0 ? "warn" : ""],
    [L.kpi_limit_hits, k.limit_hits, ""],
    [L.kpi_items, (k.items_read ?? 0).toLocaleString(), ""]
  ];
  document.getElementById("kpis").innerHTML = items.map(([label, v, cls]) =>
    `<div class="kpi"><div class="k">${esc(label)}</div><div class="v num ${cls}">${esc(v)}</div></div>`).join("");
}

function renderChips() {
  const { L } = state;
  const defs = [["ALL", L.filter_all], ["US", L.market_US], ["CN", L.market_CN], ["KR", L.market_KR]];
  document.getElementById("chips").innerHTML = defs.map(([id, label]) =>
    `<button class="chip" data-mkt="${id}" aria-pressed="${state.market === id}">${esc(label)}</button>`).join("");
}

function sourceRow(s) {
  return `<a class="src" href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">
    <span class="t">${esc(s.title)}</span><span class="d">${esc(domainOf(s.url))}</span><span class="arrow">&#8599;</span></a>`;
}

function card(e) {
  const { L } = state;
  const color = riskColor(e.score);
  const pct = Math.round(Math.min(Math.max(e.score, 0), 1) * 100);
  const flags = (e.flags || []).map(f =>
    `<span class="flag${e.score >= 0.6 ? " hot" : ""}">${esc(f)}</span>`).join("");
  const claims = (e.claims || []).map(c => `<li>${esc(c)}</li>`).join("");
  const sources = (e.sources || []).map(sourceRow).join("");
  const contra = e.contrarian ? `<div class="contra">${esc(L.contrarian)}${esc(e.contrarian)}</div>` : "";
  const issue = e.issue_url ? `<a class="issue" href="${esc(e.issue_url)}" target="_blank" rel="noopener noreferrer">${esc(L.issue_link)} &#8599;</a>` : "";
  const details = (claims || sources) ? `
    <details>
      <summary>${esc(L.evidence_toggle)}</summary>
      ${claims ? `<div class="ev"><h4>${esc(L.claims)}</h4><ul>${claims}</ul></div>` : ""}
      ${sources ? `<div class="ev"><h4>${esc(L.sources)}</h4><div class="srcs">${sources}</div></div>` : ""}
      ${contra}${issue}
    </details>` : "";
  return `<article class="card">
    <span class="spine" aria-hidden="true"><i style="height:${pct}%;background:${color}"></i></span>
    <div class="head">
      <div><div class="nm">${esc(e.name)}</div><div class="tk">${esc(e.ticker)}</div></div>
      <span class="mkt"><span class="sq" style="background:${MARKET_COLORS[e.market_id] || "var(--ink-3)"}"></span>${esc(L["market_" + e.market_id] || e.market_id)}</span>
      <div class="score"><div class="n num" style="color:${color}">${e.score.toFixed(2)}</div><div class="l">${esc(L.score)}</div></div>
    </div>
    <div class="facts num">
      <span>${esc(L.sentiment_z)} ${e.sentiment_z.toFixed(1)}</span>${flags}
    </div>
    ${details}
  </article>`;
}

function renderList() {
  const rows = state.data.entries
    .filter(e => state.market === "ALL" || e.market_id === state.market)
    .sort((a, b) => b.score - a.score);
  document.getElementById("list").innerHTML = rows.map(card).join("");
}

async function init() {
  state.L = await loadJson("./i18n/zh.json", "fallback-locale");
  state.data = await loadJson("./dashboard.json", "fallback-data");
  renderHeader(); renderKpis(); renderChips(); renderList();
  document.getElementById("chips").addEventListener("click", ev => {
    const b = ev.target.closest("button[data-mkt]");
    if (!b) return;
    state.market = b.dataset.mkt;
    renderChips(); renderList();
  });
}
init();
</script>
